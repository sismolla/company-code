<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{% csrf_token %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaConnect | Supplier Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #f8f9fa;
            --accent-color: #e74c3c;
            --text-color: #333;
            --light-text: #777;
            --white: #fff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f9fc;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem;
        }
        
        .auth-card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }
        
        .auth-hero {
            background: linear-gradient(135deg, var(--primary-color), #1e6ea0);
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .auth-hero i.fa-4x {
            font-size: 4rem;
            margin-bottom: 2rem;
        }
        
        .auth-hero h2 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        
        .auth-content {
            padding: 3rem;
            overflow-y: auto;
            max-height: 90vh; /* Prevents overflow on tall forms */
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
        }
        
        .auth-tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--light-text);
            position: relative;
        }
        
        .auth-tab.active {
            color: var(--primary-color);
        }
        
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-color);
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group .required:after {
            content: " *";
            color: var(--accent-color);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-control.invalid {
            border-color: var(--accent-color);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(42, 127, 186, 0.1);
        }

        .error-message {
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .error-message:not(:empty) {
            display: block;
        }

        .message-box {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            display: none;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .message-box.show {
            opacity: 1;
        }

        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message-box.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
            margin-top: 1rem;
        }
        
        .btn-primary:hover {
            background: #1e6ea0;
        }

        .logo-upload {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .logo-preview {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #ccc;
        }
        
        .logo-preview i {
            color: var(--light-text);
            font-size: 2rem;
        }
        
        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-upload-controls {
            flex: 1;
        }

        .file-input-label {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: #f0f8ff;
            color: var(--primary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e1f0ff;
        }

        .file-input {
            display: none;
        }

        .file-name {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--light-text);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--light-text);
        }
        
        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .auth-card {
                grid-template-columns: 1fr;
            }
            
            .auth-hero {
                display: none; /* Hide hero on mobile */
            }

            .auth-content {
                max-height: none;
            }
        }
        
        @media (max-width: 480px) {
            .auth-content {
                padding: 1.5rem;
            }
            
            .auth-tab {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }
            
            .logo-upload {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }

        .forgot-password-link {
    display: block;
    text-align: right;
    margin-top: 10px;
    font-size: 0.9rem;
    color: #007bff; /* Blue for a link, typical for a primary action */
    text-decoration: none;
    transition: color 0.3s ease;
}

.forgot-password-link:hover {
    color: #0056b3; /* A slightly darker blue on hover */
    text-decoration: underline;
}
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <!-- Hero Section -->
        <div class="auth-hero">
            <i class="fas fa-prescription-bottle-alt fa-4x"></i>
            <h2>Connect with Pharmacies Worldwide</h2>
            <p>Join PharmaConnect's network of trusted pharmaceutical Wholesalers</p>
        </div>

        <!-- Auth Content -->
        <div class="auth-content">
            <div id="messageBox" class="message-box"></div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Login</div>
                <div class="auth-tab" data-tab="signup">Register</div>
            </div>

            <!-- Login Form -->
            <form method="post" class="auth-form active" id="loginForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="login-email" class="required">Email Address</label>
                    <input type="email" id="login-email" name="email" class="form-control" required>
                    <span class="error-message" id="login-email-error"></span>
                </div>

                <div class="form-group">
                    <label for="login-password" class="required">Password</label>
                    <input type="password" id="login-password" name="password" class="form-control" required>
                    <span class="error-message" id="login-password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </button>

                <div class="auth-footer-password">
                    <a href="{% url 'password_reset' %}" class="forgot-password-link">Forgot password?</a>
                </div>
            </form>

            <!-- Signup Form -->
            <form class="auth-form" id="signupForm" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Business Information -->
                <div class="form-group">
                    <label for="name" class="required">Business Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                    <span class="error-message" id="name-error"></span>
                </div>

                <div class="form-group">
                    <label for="phone" class="required">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" required>
                    <span class="error-message" id="phone-error"></span>
                </div>

                <div class="form-group">
                    <label for="cities" class="required">City</label>
                    <select id="cities" name="city" class="form-control" required>
                        <option value="">Select your city</option>
                        {% for city in cities %}
                            <option value="{{ city.id }}">{{ city.name }}</option>
                        {% endfor %}
                    </select>
                    <span class="error-message" id="cities-error"></span>
                </div>

                <div class="form-group">
                    <label for="address">Detail Business Address</label>
                    <textarea id="address" name="address" class="form-control" placeholder="Your place detail location eg, bole bulbula, bole bras,.." rows="3"></textarea>
                    <span class="error-message" id="address-error"></span>
                </div>

                <!-- Logo Upload -->
                <div class="form-group">
                    <label>Business Logo</label>
                    <div class="logo-upload">
                        <div class="logo-preview" id="logoPreview">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="logo-upload-controls">
                            <label for="logo" class="file-input-label">
                                <i class="fas fa-upload"></i> Choose Logo
                            </label>
                            <input type="file" id="logo" name="logo" class="file-input" accept="image/*">
                            <div class="file-name" id="fileName">No file chosen</div>
                        </div>
                    </div>
                    <small>Recommended: Square image (200×200px), JPG or PNG</small>
                    <span class="error-message" id="logo-error"></span>
                </div>

                <div class="form-group">
                    <label for="whatsapp_link">WhatsApp Contact Link</label>
                    <input type="url" id="whatsapp_link" name="whatsapp_link" class="form-control" placeholder="https://wa.me/2519.......">
                    <span class="error-message" id="whatsapp_link-error"></span>
                </div>

                <div class="form-group">
                    <label for="telegram_link">Telegram Contact Link</label>
                    <input type="url" id="telegram_link" name="telegram_link" class="form-control" placeholder="https://t.me/yourusername">
                    <span class="error-message" id="telegram_link-error"></span>
                </div>

                <!-- Account Credentials -->
                <div class="form-group">
                    <label for="username" class="required">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="8">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="required">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                    <span class="error-message" id="confirm_password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Supplier Account
                </button>

                <div class="auth-footer">
                    <a href="#" class="switch-to-login">Already have an account? Log in</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const tabs = document.querySelectorAll('.auth-tab');
const forms = document.querySelectorAll('.auth-form');
const messageBox = document.getElementById('messageBox');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');

function getCookie(name){
    let cookieValue=null;
    if(document.cookie && document.cookie!==''){
        const cookies=document.cookie.split(';');
        for(let cookie of cookies){
            cookie=cookie.trim();
            if(cookie.startsWith(name+'=')){
                cookieValue=decodeURIComponent(cookie.substring(name.length+1));
                break;
            }
        }
    }
    return cookieValue;
}

function showMessageBox(message,type){
    messageBox.textContent=message;
    messageBox.className=`message-box show ${type}`;
    messageBox.style.display='block';
}

function clearErrors(){
    document.querySelectorAll('.error-message').forEach(el=>el.textContent='');
    document.querySelectorAll('.form-control.invalid').forEach(el=>el.classList.remove('invalid'));
    messageBox.style.display='none';
}

function showError(inputElement,message){
    const errorElement=document.getElementById(`${inputElement.id}-error`);
    if(errorElement){ errorElement.textContent=message; inputElement.classList.add('invalid'); }
}

// Tab switching
tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
        clearErrors();
        tabs.forEach(t=>t.classList.remove('active'));
        forms.forEach(f=>f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-tab')+'Form').classList.add('active');
    });
});

document.querySelector('.switch-to-login').addEventListener('click',e=>{
    e.preventDefault();
    document.querySelector('[data-tab="login"]').click();
});

// Logo preview
const logoInput=document.getElementById('logo');
const logoPreview=document.getElementById('logoPreview');
const fileName=document.getElementById('fileName');
logoInput.addEventListener('change',function(){
    const file=this.files[0];
    if(file){
        fileName.textContent=file.name;
        const reader=new FileReader();
        reader.onload=e=>{
            logoPreview.innerHTML='';
            const img=document.createElement('img');
            img.src=e.target.result;
            logoPreview.appendChild(img);
        }
        reader.readAsDataURL(file);
    } else{
        fileName.textContent='No file chosen';
        logoPreview.innerHTML='<i class="fas fa-building"></i>';
    }
});

// Login submit
loginForm.addEventListener('submit',async e=>{
    e.preventDefault(); clearErrors();
    const email=document.getElementById('login-email');
    const password=document.getElementById('login-password');
    let isValid=true;
    if(email.value.trim()===''){ showError(email,'Email required'); isValid=false; }
    if(password.value.trim()===''){ showError(password,'Password required'); isValid=false; }
    if(!isValid){ showMessageBox('Fix errors below','error'); return; }
    loginBtn.disabled=true; loginBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Logging in...';

    try{
        const res=await fetch("{% url 'landing:user-login' %}",{
            method:'POST',
            headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
            credentials:'include',
            body:JSON.stringify({email:email.value,password:password.value})
        });
        const data=await res.json();
        if(res.ok){
            showMessageBox(data.message||'Login successful','success');
            setTimeout(()=>{ window.location.href=data.next||'{% url "landing:dashboard" %}'; },1000);
        } else showMessageBox(data.detail||'Invalid credentials','error');
    } catch(err){ showMessageBox('Network error','error'); }
    finally{ loginBtn.disabled=false; loginBtn.innerHTML='<i class="fas fa-sign-in-alt"></i> Log In'; }
});

// Signup submit
signupForm.addEventListener('submit', async e => {
    e.preventDefault();
    clearErrors();

    let isValid = true;
    const name = document.getElementById('name');
    const username = document.getElementById('username');
    const phone = document.getElementById('phone');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm_password');
    const whatsapp = document.getElementById('whatsapp_link');
    const telegram = document.getElementById('telegram_link');
    const city = document.getElementById('cities');

    [name, username, phone, email, password, confirm].forEach(f => {
        if(f.value.trim() === '') { showError(f,'Required'); isValid = false; }
    });

    if(city.value.trim() === '') { showError(city,'City is required'); isValid = false; }

    if(password.value !== confirm.value) {
        showError(password,'Passwords do not match'); 
        showError(confirm,'Passwords do not match'); 
        isValid = false;
    }

    if(!isValid){ showMessageBox('Fix errors below','error'); return; }

    signupBtn.disabled = true;
    signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
    const formData = new FormData(signupForm);

    try {
        const res = await fetch("{% url 'landing:supplier-signup' %}", {
            method:'POST',
            body: formData,
            headers: { 'X-CSRFToken': getCookie('csrftoken') },
        });
        const data = await res.json();
        if(res.ok){
            signupForm.reset();
            showMessageBox(data.message || 'Account created!','success');
            setTimeout(()=> window.location.href='{% url "landing:user-signup" %}',2000);
        } else {
            if(data.detail) showMessageBox(data.detail,'error');
            for(const [k,v] of Object.entries(data)){
                const el = document.getElementById(k);
                if(el && Array.isArray(v) && v.length>0) showError(el,v[0]);
            }
        }
    } catch(err){ showMessageBox('Network error','error'); }
    finally { signupBtn.disabled = false; signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Supplier Account'; }
});
</script>
</body>


</html>
