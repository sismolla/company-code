<div class="container mt-4">
  <h2>Supplier Profile Settings</h2>
  <form id="supplierProfileForm">
    <!-- Industries -->
    <div class="mb-3">
      <label for="industries" class="form-label">Industries</label>
      <select id="industries" name="industries" class="form-select" multiple>
        <option value="1">Medical Device Manufacturer</option>
        <option value="2">Medical Device Distributor / Wholesaler</option>
        <option value="3">Pharmaceutical Manufacturer</option>
        <option value="4">Pharmaceutical Distributor / Wholesaler</option>
        <option value="5">Hospital / Clinic Supplier</option>
        <option value="6">Retail Pharmacy / Medical Store</option>
        <option value="7">NGO / Government Supplier</option>
        <option value="8">Service & Maintenance Provider</option>
        <option value="9">Laboratory / Diagnostic Supplier</option>
        <option value="10">Telemedicine / Health Tech Provider</option>
      </select>
    </div>

    <!-- Specialized Equipment -->
    <div class="mb-3">
      <label for="specialized_equipment" class="form-label">Specialized Equipment</label>
      <input type="text" id="specialized_equipment" name="specialized_equipment" class="form-control" placeholder="Enter equipment names (comma separated)">
    </div>

    <!-- Cities -->
    <div class="mb-3">
      <label for="cities" class="form-label">Cities Served</label>
      <select id="cities" name="cities" class="form-select" multiple>
        <option value="1">Addis Ababa</option>
        <option value="2">Adama (Nazret)</option>
        <option value="3">Bahir Dar</option>
        <option value="4">Gondar</option>
        <option value="5">Mekelle</option>
        <option value="6">Hawassa</option>
        <option value="7">Dire Dawa</option>
        <option value="8">Dessie</option>
        <option value="9">Jijiga</option>
        <option value="10">Jimma</option>
        <option value="11">Harar</option>
        <option value="12">Nekemte</option>
        <option value="13">Shashemene</option>
        <option value="14">Debre Markos</option>
        <option value="15">Debre Birhan</option>
        <option value="16">Kombolcha</option>
        <option value="17">Asosa</option>
        <option value="18">Gambela</option>
        <option value="19">Semera</option>
        <option value="20">Axum</option>
      </select>
    </div>

    <!-- Submit -->
    <div class="d-grid">
      <button type="submit" class="btn btn-primary">Save Profile</button>
    </div>
  </form>

  <div id="responseMessage" class="mt-3"></div>
</div>

<script>
document.getElementById("supplierProfileForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    // Collect form data
    const industries = Array.from(document.getElementById("industries").selectedOptions).map(opt => opt.value);
    const equipmentInput = document.getElementById("specialized_equipment").value;
    const specialized_equipment = equipmentInput ? equipmentInput.split(",").map(item => item.trim()) : [];
    const cities = Array.from(document.getElementById("cities").selectedOptions).map(opt => opt.value);

    const data = {
        industries: industries,
        specialized_equipment: specialized_equipment,
        cities: cities
    };

    try {
        const response = await fetch("/profile-setting/", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken"), // for Django
            },
            body: JSON.stringify(data),
        });

        const result = await response.json();
        const messageBox = document.getElementById("responseMessage");

        if (response.ok) {
            messageBox.innerHTML = `<div class="alert alert-success">Profile updated successfully!</div>`;
        } else {
            messageBox.innerHTML = `<div class="alert alert-danger">Error: ${result.detail || "Something went wrong."}</div>`;
        }
    } catch (error) {
        document.getElementById("responseMessage").innerHTML =
            `<div class="alert alert-danger">Network error: ${error}</div>`;
    }
});

// Helper function for CSRF token (Django)
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
